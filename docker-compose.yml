###############################################################################
# GLM Chat Application — Local Development Stack
#
# Usage:
#   docker compose up -d
#   docker compose logs -f chat-service
#
# NOTE: The inference-service requires a GPU and is replaced by a mock stub
#       that returns canned SSE responses for local development.
###############################################################################

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: glmchat_admin
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: glmchat
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glmchat_admin -d glmchat"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Mock Inference (no GPU required)
  # ---------------------------------------------------------------------------
  inference-mock:
    build:
      context: ./services/inference-service
      dockerfile: Dockerfile.mock
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------------------
  embedding-service:
    build:
      context: ./services/embedding-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag-service:
    build:
      context: ./services/rag-service
    ports:
      - "8002:8002"
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=glmchat_admin
      - PGPASSWORD=localdev
      - PGDATABASE=glmchat
      - EMBEDDING_SERVICE_URL=http://embedding-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_healthy

  confidence-scorer:
    build:
      context: ./services/confidence-scorer
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  chat-service:
    build:
      context: ./services/chat-service
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=glmchat_admin
      - PGPASSWORD=localdev
      - PGDATABASE=glmchat
      - INFERENCE_SERVICE_URL=http://inference-mock:8000
      - EMBEDDING_SERVICE_URL=http://embedding-service:8001
      - RAG_SERVICE_URL=http://rag-service:8002
      - SCORER_SERVICE_URL=http://confidence-scorer:8003
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      inference-mock:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    environment:
      - CHAT_SERVICE_URL=http://chat-service:8080
    depends_on:
      - chat-service

volumes:
  redis-data:
  postgres-data:
