apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: glm-chat-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: gpu-alerts
      rules:
        - alert: HighGPUUtilization
          expr: avg(dcgm_fi_dev_gpu_util{workload="inference"}) > 85
          for: 60s
          labels:
            severity: warning
          annotations:
            summary: "GPU utilisation above 85% for 60s"
            description: "Average GPU utilisation across inference pods is {{ $value }}%, exceeding the 85% threshold for over 60 seconds."
            runbook_url: "https://runbooks.internal/gpu-high-util"

    - name: inference-alerts
      rules:
        - alert: InferenceErrorRate
          expr: |
            (
              rate(http_requests_total{service="inference",status=~"5.."}[5m])
              /
              rate(http_requests_total{service="inference"}[5m])
            ) > 0.05
          for: 60s
          labels:
            severity: critical
          annotations:
            summary: "Inference service error rate above 5%"
            description: "The inference service 5xx error rate is {{ $value | humanizePercentage }}, exceeding the 5% threshold for over 60 seconds."
            runbook_url: "https://runbooks.internal/inference-errors"

    - name: scorer-alerts
      rules:
        - alert: ConfidenceScorerDown
          expr: up{job="confidence-scorer"} == 0
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Confidence Scorer is down"
            description: "The confidence scorer service has been unreachable for 30 seconds. Chat service will return refusal messages for all requests."
            runbook_url: "https://runbooks.internal/scorer-down"
---
# Alertmanager Configuration (deployed as a Secret or via kube-prometheus-stack values)
# This ConfigMap provides the full Alertmanager config with SNS routing and retry logic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: sns-with-retry
      routes:
        - match:
            severity: critical
          receiver: sns-with-retry
          group_wait: 10s
          repeat_interval: 1h
        - match:
            severity: warning
          receiver: sns-with-retry
          group_wait: 30s
          repeat_interval: 4h

    receivers:
      - name: sns-with-retry
        sns_configs:
          - topic_arn: "${SNS_TOPIC_ARN}"
            region: us-east-1
            send_resolved: true
            # Retry configuration: 3 retries with exponential backoff
            http_config:
              tls_config:
                insecure_skip_verify: false
            # Alertmanager native retry: max_retries with backoff
            # Exponential backoff: initial 1s, factor 2, max 3 retries
        webhook_configs:
          - url: "http://sns-retry-logger.monitoring.svc:8080/publish"
            send_resolved: true
            http_config:
              tls_config:
                insecure_skip_verify: false

    # Inhibition rules to reduce noise
    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ['alertname', 'namespace']
---
# SNS Retry Logger - logs failed SNS publishes to CloudWatch
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sns-retry-logger
  namespace: monitoring
  labels:
    app: sns-retry-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sns-retry-logger
  template:
    metadata:
      labels:
        app: sns-retry-logger
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: system-od
      serviceAccountName: alertmanager-sns-publisher
      containers:
        - name: sns-publisher
          image: python:3.12-slim
          command:
            - python
            - /app/sns_publisher.py
          ports:
            - containerPort: 8080
          env:
            - name: SNS_TOPIC_ARN
              valueFrom:
                configMapKeyRef:
                  name: alertmanager-config
                  key: sns_topic_arn
                  optional: true
            - name: AWS_REGION
              value: us-east-1
            - name: MAX_RETRIES
              value: "3"
            - name: INITIAL_BACKOFF_SEC
              value: "1"
            - name: CLOUDWATCH_LOG_GROUP
              value: /glm-chat/alertmanager
          volumeMounts:
            - name: app-code
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: app-code
          configMap:
            name: sns-retry-logger-code
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sns-retry-logger-code
  namespace: monitoring
data:
  sns_publisher.py: |
    """
    SNS Retry Logger
    Receives alerts from Alertmanager, publishes to SNS with 3-retry
    exponential backoff, and logs failures to CloudWatch.
    """
    import json
    import os
    import time
    import logging
    from http.server import HTTPServer, BaseHTTPRequestHandler

    import boto3
    from botocore.exceptions import ClientError

    logging.basicConfig(level=logging.INFO, format='%(asctime)s %(levelname)s %(message)s')
    logger = logging.getLogger(__name__)

    SNS_TOPIC_ARN = os.environ.get("SNS_TOPIC_ARN", "")
    AWS_REGION = os.environ.get("AWS_REGION", "us-east-1")
    MAX_RETRIES = int(os.environ.get("MAX_RETRIES", "3"))
    INITIAL_BACKOFF_SEC = float(os.environ.get("INITIAL_BACKOFF_SEC", "1"))
    CW_LOG_GROUP = os.environ.get("CLOUDWATCH_LOG_GROUP", "/glm-chat/alertmanager")

    sns_client = boto3.client("sns", region_name=AWS_REGION)
    cw_client = boto3.client("logs", region_name=AWS_REGION)

    def ensure_log_group():
        try:
            cw_client.create_log_group(logGroupName=CW_LOG_GROUP)
        except cw_client.exceptions.ResourceAlreadyExistsException:
            pass

    def log_to_cloudwatch(message: str):
        try:
            stream_name = f"sns-failures-{int(time.time())}"
            cw_client.create_log_stream(logGroupName=CW_LOG_GROUP, logStreamName=stream_name)
            cw_client.put_log_events(
                logGroupName=CW_LOG_GROUP,
                logStreamName=stream_name,
                logEvents=[{
                    "timestamp": int(time.time() * 1000),
                    "message": message,
                }],
            )
        except Exception as e:
            logger.error(f"Failed to log to CloudWatch: {e}")

    def publish_with_retry(payload: dict) -> bool:
        backoff = INITIAL_BACKOFF_SEC
        for attempt in range(1, MAX_RETRIES + 1):
            try:
                sns_client.publish(
                    TopicArn=SNS_TOPIC_ARN,
                    Message=json.dumps(payload),
                    Subject="GLM Chat Alert",
                )
                logger.info(f"SNS publish succeeded on attempt {attempt}")
                return True
            except ClientError as e:
                logger.warning(f"SNS publish attempt {attempt} failed: {e}")
                if attempt < MAX_RETRIES:
                    time.sleep(backoff)
                    backoff *= 2
                else:
                    error_msg = json.dumps({
                        "event": "sns_publish_failure",
                        "attempts": MAX_RETRIES,
                        "error": str(e),
                        "payload_summary": json.dumps(payload)[:500],
                    })
                    log_to_cloudwatch(error_msg)
                    logger.error(f"SNS publish failed after {MAX_RETRIES} retries")
                    return False
        return False

    class AlertHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            content_length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(content_length)
            try:
                payload = json.loads(body)
            except json.JSONDecodeError:
                self.send_response(400)
                self.end_headers()
                return

            success = publish_with_retry(payload)
            self.send_response(200 if success else 502)
            self.end_headers()

        def log_message(self, format, *args):
            logger.info(format % args)

    if __name__ == "__main__":
        ensure_log_group()
        server = HTTPServer(("0.0.0.0", 8080), AlertHandler)
        logger.info("SNS retry logger listening on port 8080")
        server.serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: sns-retry-logger
  namespace: monitoring
spec:
  selector:
    app: sns-retry-logger
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
