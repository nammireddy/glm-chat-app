replicaCount: 2

image:
  repository: ""  # ECR repository URL, e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/chat-service
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: chat-service
  annotations:
    eks.amazonaws.com/role-arn: ""  # IRSA role ARN from Terraform output

autoscaling:
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: ""
  annotations: {}
  certificateArn: ""  # ACM certificate ARN from Terraform output
  host: ""  # Application domain name

securityGroup: sg-chat-svc

probes:
  readiness:
    path: /ready
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}

tolerations: []

affinity: {}
