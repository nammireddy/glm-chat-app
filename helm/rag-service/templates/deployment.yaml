apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-service.fullname" . }}
  labels:
    {{- include "rag-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rag-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rag-service.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: PGHOST
              value: {{ .Values.env.PGHOST | quote }}
            - name: PGPORT
              value: {{ .Values.env.PGPORT | quote }}
            - name: PGUSER
              value: {{ .Values.env.PGUSER | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-service.fullname" . }}-db
                  key: password
                  optional: true
            - name: PGDATABASE
              value: {{ .Values.env.PGDATABASE | quote }}
            - name: EMBEDDING_SERVICE_URL
              value: {{ .Values.env.EMBEDDING_SERVICE_URL | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
