{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "inference-service.fullname" . }}
  labels:
    app: {{ include "inference-service.name" . }}
    workload: inference
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: {{ include "inference-service.name" . }}
      workload: inference
{{- end }}
